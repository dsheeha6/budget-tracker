<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Budget · Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        font-family: -apple-system, system-ui, sans-serif;
        text-align: center;
        background: #09090b;
        color: #f4f4f5;
      }
      @media (prefers-color-scheme: light) {
        body { background: #f4f4f5; color: #18181b; }
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      p { margin: 0; color: #71717a; }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        border: 0;
        border-radius: 12px;
        background: #4f46e5;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="/icon-192.png" alt="" />
    <h1 style="margin: 0; font-size: 22px">You're offline</h1>
    <p>Your budget lives in the cloud, so it needs a connection.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
