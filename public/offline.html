<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Penny · Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        font-family: -apple-system, system-ui, sans-serif;
        text-align: center;
        background: #1b1916;
        color: #efe7d8;
      }
      @media (prefers-color-scheme: light) {
        body { background: #f3ecdd; color: #2a2521; }
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      p { margin: 0; color: #8a8075; }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        border: 2.5px solid #2a2521;
        border-radius: 14px;
        box-shadow: 3px 3px 0 #2a2521;
        background: #4d6f9c;
        color: #fbf7ee;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="/icon-192.png" alt="" />
    <h1 style="margin: 0; font-size: 22px">You're offline</h1>
    <p>Penny keeps your budget in the cloud, so it needs a connection.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
